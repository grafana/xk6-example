name: Validate

permissions: {}

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.go-versions.outputs.current }}
      prev: ${{ steps.go-versions.outputs.prev }}
    steps:
      - name: Resolve Go versions
        id: go-versions
        uses: grafana/k6-ci/.github/actions/go-versions@41aaf8e365b56fd120b0396beae2eba3969babab # v0.5.1

  validate:
    name: Validate
    needs: configure
    uses: grafana/xk6/.github/workflows/extension-validate.yml@b302a90014ee698bbf3c9f7c908b79ec8dd8053b # v1.4.6
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      go-version: ${{ needs.configure.outputs.current }}
      go-versions: '["${{ needs.configure.outputs.prev }}", "${{ needs.configure.outputs.current }}"]'
      golangci-lint-version: "v2.7.1"
      platforms: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      k6-versions: '["v2.0.0-rc1"]'
      xk6-version: "1.4.1"
      xk6-test-pattern: "test/*.test.{j,t}s"
